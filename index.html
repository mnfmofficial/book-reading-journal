<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Reading Journal</title>
  <link rel="manifest" href="manifest.json">
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <!-- Google Fonts for Cozy Bookish Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #fbf7f0;
      --bg-card: #ffffff;
      --bg-sidebar: #f4ede2;
      --text-main: #2c2523;
      --text-muted: #736b65;
      --border-color: #e6ded4;
      --accent-color: #8c4a27;
      --accent-hover: #70381c;
      --accent-light: #f5ebe6;
      --tag-bg: #efe8de;
      --shadow: 0 4px 12px rgba(0,0,0,0.04);
      --font-serif: 'Lora', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1816;
      --bg-card: #24211e;
      --bg-sidebar: #1f1c19;
      --text-main: #e8e3dd;
      --text-muted: #9e958c;
      --border-color: #38332e;
      --accent-color: #d98a5b;
      --accent-hover: #e89e71;
      --accent-light: #2d231d;
      --tag-bg: #2e2925;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Layout */
    #sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; flex-grow: 1; }
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      border: none;
      background: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background-color: rgba(0,0,0,0.04); }
    .nav-btn.active { background-color: var(--accent-color); color: #ffffff; }

    .sidebar-actions { display: flex; flex-direction: column; gap: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); }
    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .btn-secondary:hover { background: var(--tag-bg); }

    #main-content {
      flex-grow: 1;
      padding: 2.5rem 3rem;
      overflow-y: auto;
      max-height: 100vh;
    }

    .view { display: none; }
    .view.active { display: block; }

    h1, h2, h3, h4 { font-family: var(--font-serif); color: var(--text-main); }
    h1 { font-size: 2rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.4rem; margin-bottom: 1rem; }

    /* Cards & Stats */
    .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-bottom: 2rem; }
    .stat-card {
      background: var(--bg-card);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent-color); font-family: var(--font-serif); }
    .stat-card .label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Heatmap & SVG Charts */
    .dashboard-section { margin-bottom: 2.5rem; }
    .heatmap-grid { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; overflow-x: auto; padding: 0.5rem 0; }
    .heatmap-cell { width: 12px; height: 12px; background: var(--border-color); border-radius: 2px; }
    .heatmap-cell[data-level="1"] { background: #e2ab8e; }
    .heatmap-cell[data-level="2"] { background: #cb774a; }
    .heatmap-cell[data-level="3"] { background: var(--accent-color); }

    /* Lists & Grids */
    .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .book-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease;
    }
    .book-card:hover { transform: translateY(-2px); }
    .book-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-color); margin-bottom: 0.2rem; }
    .book-author { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.8rem; font-style: italic; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-reading { background: #e0f2fe; color: #0369a1; }
    .badge-completed { background: #dcfce7; color: #15803d; }
    .badge-dnf { background: #fee2e2; color: #b91c1c; }
    .badge-want-to-read { background: #fef3c7; color: #b45309; }

    /* Dynamic Lists in Form */
    .dynamic-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .dynamic-item { display: flex; gap: 0.5rem; align-items: center; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 1.2rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main); }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
    }
    textarea { resize: vertical; min-height: 90px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-color); }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .md-preview {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.8rem;
      min-height: 90px;
      font-size: 0.9rem;
      overflow-y: auto;
    }

    .btn-primary {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Flashcard Quiz */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3rem;
      text-align: center;
      max-width: 500px;
      margin: 2rem auto;
      box-shadow: var(--shadow);
    }
    .quiz-word { font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 1rem; color: var(--accent-color); }
    .quiz-meaning { font-size: 1.1rem; color: var(--text-main); margin: 1.5rem 0; min-height: 60px; display: none; }

    /* Filters Bar */
    .filters-bar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; background: var(--bg-card); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); }

    /* Side by Side Comparison */
    .entries-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .entry-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; }

    /* Responsive Design */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; padding: 1rem; }
      .editor-grid, .form-row { grid-template-columns: 1fr; }
      #main-content { padding: 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation Sidebar -->
  <aside id="sidebar">
    <div class="brand">📖 Reader's Nook</div>
    <ul class="nav-links">
      <li><button class="nav-btn active" onclick="switchView('dashboard')">📊 Dashboard</button></li>
      <li><button class="nav-btn" onclick="switchView('library')">📚 Library</button></li>
      <li><button class="nav-btn" onclick="switchView('editor')">✏️ New Entry</button></li>
      <li><button class="nav-btn" onclick="switchView('glossary')">🔤 Glossary</button></li>
      <li><button class="nav-btn" onclick="switchView('practice')">✅ Practice List</button></li>
    </ul>
    <div class="sidebar-actions">
      <button class="btn-secondary" onclick="exportData()">📥 Export JSON</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📤 Import JSON</button>
      <input type="file" id="importFile" style="display:none" onchange="importData(event)">
      <button class="btn-secondary" onclick="toggleTheme()">🌗 Toggle Mode</button>
    </div>
  </aside>

  <!-- Main View Container -->
  <main id="main-content">

    <!-- VIEW 1: DASHBOARD -->
    <section id="view-dashboard" class="view active">
      <h1>Dashboard</h1>
      <div class="stats-strip">
        <div class="stat-card">
          <div class="label">Total Books</div>
          <div class="num" id="stat-total-books">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Completed This Year</div>
          <div class="num" id="stat-completed-year">0</div>
        </div>
        <div class="stat-card">
          <div class="label">Reading Streak</div>
          <div class="num" id="stat-streak">0 Days</div>
        </div>
      </div>

      <div class="dashboard-section">
        <h2>Currently Reading</h2>
        <div id="currently-reading-list" class="book-grid"></div>
      </div>

      <div class="dashboard-section">
        <h2>Reading Activity (Heatmap)</h2>
        <div class="heatmap-grid" id="heatmap"></div>
      </div>

      <div class="dashboard-section">
        <h2>Genre Breakdown</h2>
        <div id="genre-chart-container" style="max-width: 400px; margin-top: 1rem;"></div>
      </div>
    </section>

    <!-- VIEW 2: LIBRARY -->
    <section id="view-library" class="view">
      <h1>Library</h1>
      <div class="filters-bar">
        <input type="text" id="filter-search" placeholder="Search title or author..." oninput="renderLibrary()" style="flex-grow: 2;">
        <select id="filter-genre" onchange="renderLibrary()">
          <option value="">All Genres</option>
          <option>Fiction</option><option>Non-Fiction</option><option>Sci-Fi</option><option>Fantasy</option>
          <option>Mystery/Thriller</option><option>Romance</option><option>Biography</option><option>Self-Help</option>
          <option>History</option><option>Philosophy</option><option>Horror</option><option>Poetry</option><option>Other</option>
        </select>
        <select id="filter-status" onchange="renderLibrary()">
          <option value="">All Statuses</option>
          <option value="reading">Reading</option>
          <option value="completed">Completed</option>
          <option value="DNF">DNF</option>
          <option value="want-to-read">Want to Read</option>
        </select>
      </div>
      <div id="library-book-list" class="book-grid"></div>
      
      <!-- Book Detail / Compare Modal/Container -->
      <div id="book-detail-container" style="margin-top: 2rem; display: none;"></div>
    </section>

    <!-- VIEW 3: ENTRY EDITOR -->
    <section id="view-editor" class="view">
      <h1 id="editor-title">New Book Entry</h1>
      <form id="entry-form" onsubmit="saveEntry(event)">
        <input type="hidden" id="entry-id">
        <input type="hidden" id="book-id">

        <div class="form-row">
          <div class="form-group">
            <label>Book Title</label>
            <input type="text" id="input-title" required>
          </div>
          <div class="form-group">
            <label>Author</label>
            <input type="text" id="input-author" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="input-status" onchange="calcDuration()">
              <option value="reading">Reading</option>
              <option value="completed">Completed</option>
              <option value="DNF">DNF</option>
              <option value="want-to-read">Want to Read</option>
            </select>
          </div>
          <div class="form-group">
            <label>Genre</label>
            <select id="input-genre">
              <option>Fiction</option><option>Non-Fiction</option><option>Sci-Fi</option><option>Fantasy</option>
              <option>Mystery/Thriller</option><option>Romance</option><option>Biography</option><option>Self-Help</option>
              <option>History</option><option>Philosophy</option><option>Horror</option><option>Poetry</option><option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="input-start-date" onchange="calcDuration()">
          </div>
          <div class="form-group">
            <label>Finish Date</label>
            <input type="date" id="input-finish-date" onchange="calcDuration()">
          </div>
        </div>
        <div id="duration-display" style="font-size: 0.85rem; color: var(--text-muted); margin-top: -0.5rem; margin-bottom: 1rem;"></div>

        <div class="form-group">
          <label>Custom Tags (comma separated)</label>
          <input type="text" id="input-tags" placeholder="e.g. mind-bending, classic, productivity">
        </div>

        <!-- Markdown Textareas with Preview -->
        <div class="form-group">
          <label>Core Plot Summary (Markdown Supported)</label>
          <div class="editor-grid">
            <textarea id="input-summary" oninput="updatePreview('summary')"></textarea>
            <div id="preview-summary" class="md-preview"></div>
          </div>
        </div>

        <div class="form-group">
          <label>My Understanding / Theme (Markdown Supported)</label>
          <div class="editor-grid">
            <textarea id="input-theme" oninput="updatePreview('theme')"></textarea>
            <div id="preview-theme" class="md-preview"></div>
          </div>
        </div>

        <div class="form-group">
          <label>Key Takeaways (Markdown Supported)</label>
          <div class="editor-grid">
            <textarea id="input-takeaways" oninput="updatePreview('takeaways')"></textarea>
            <div id="preview-takeaways" class="md-preview"></div>
          </div>
        </div>

        <!-- Dynamic List Components -->
        <div class="form-group">
          <label>Main Characters</label>
          <div id="character-list" class="dynamic-list"></div>
          <button type="button" class="btn-secondary" onclick="addCharacterRow()">+ Add Character</button>
        </div>

        <div class="form-group">
          <label>Quotes & Highlights</label>
          <div id="quote-list" class="dynamic-list"></div>
          <button type="button" class="btn-secondary" onclick="addQuoteRow()">+ Add Quote</button>
        </div>

        <div class="form-group">
          <label>New Words (Feeds Glossary)</label>
          <div id="word-list" class="dynamic-list"></div>
          <button type="button" class="btn-secondary" onclick="addWordRow()">+ Add Word</button>
        </div>

        <div class="form-group">
          <label>What to Practice (Feeds Practice List)</label>
          <div id="practice-list-input" class="dynamic-list"></div>
          <button type="button" class="btn-secondary" onclick="addPracticeRow()">+ Add Actionable Step</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Rating (1-5 Stars)</label>
            <select id="input-rating">
              <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
              <option value="4">⭐⭐⭐⭐ (4/5)</option>
              <option value="3">⭐⭐⭐ (3/5)</option>
              <option value="2">⭐⭐ (2/5)</option>
              <option value="1">⭐ (1/5)</option>
            </select>
          </div>
          <div class="form-group">
            <label>One-Line Verdict</label>
            <input type="text" id="input-verdict" placeholder="Short concise summary...">
          </div>
        </div>

        <div class="form-row" style="margin-bottom: 1.5rem;">
          <label><input type="checkbox" id="input-reread"> Reread Read-Through</label>
          <label><input type="checkbox" id="input-recommend"> Recommend to Others</label>
        </div>

        <button type="submit" class="btn-primary">Save Entry</button>
      </form>
    </section>

    <!-- VIEW 4: GLOSSARY & QUIZ -->
    <section id="view-glossary" class="view">
      <h1>Vocabulary Glossary</h1>
      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
        <button class="btn-primary" onclick="startQuizMode()">🧠 Start Flashcard Quiz</button>
        <input type="text" id="glossary-search" placeholder="Search words..." oninput="renderGlossary()">
      </div>

      <div id="quiz-container" style="display: none;">
        <div class="quiz-card">
          <div class="quiz-word" id="quiz-word-text">Word</div>
          <div class="quiz-meaning" id="quiz-meaning-text">Meaning...</div>
          <button id="btn-reveal" class="btn-secondary" onclick="revealQuizMeaning()">Reveal Meaning</button>
          <div id="quiz-controls" style="display: none; margin-top: 1rem; gap: 1rem; justify-content: center;">
            <button class="btn-secondary" style="background:#fee2e2" onclick="answerQuiz(false)"> Unsure</button>
            <button class="btn-primary" onclick="answerQuiz(true)"> Known</button>
          </div>
        </div>
      </div>

      <div id="glossary-list" class="book-grid"></div>
    </section>

    <!-- VIEW 5: PRACTICE LIST -->
    <section id="view-practice" class="view">
      <h1>Practice Checklist</h1>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Actionable takeaways derived from your readings.</p>
      <div id="practice-items-container" style="display: flex; flex-direction: column; gap: 0.8rem;"></div>
    </section>

  </main>

  <script>
    // LOCAL STORAGE CONSTANTS & STATE
    const STORAGE_KEY = 'book_journal_app_data';
    let appData = {
      books: [], // Array of { id, title, author }
      entries: [], // Array of entry objects
      glossaryState: {} // Spaced repetition data: { word: { interval: 1, nextReview: timestamp } }
    };

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderDashboard();
    });

    function loadData() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) appData = JSON.parse(data);
      } catch(e) {
        console.error("Corrupted local storage data", e);
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch(e) {
        alert("Failed to save data to localStorage!");
      }
    }

    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`view-${viewName}`).classList.add('active');
      event.target.classList.add('active');

      if(viewName === 'dashboard') renderDashboard();
      if(viewName === 'library') renderLibrary();
      if(viewName === 'glossary') renderGlossary();
      if(viewName === 'practice') renderPractice();
      if(viewName === 'editor') resetForm();
    }

    // FORM DYNAMIC FIELDS
    function addCharacterRow(name='', desc='') {
      const container = document.getElementById('character-list');
      const div = document.createElement('div');
      div.className = 'dynamic-item';
      div.innerHTML = `
        <input type="text" placeholder="Name" class="char-name" value="${name}">
        <input type="text" placeholder="Short Description" class="char-desc" value="${desc}">
        <button type="button" class="btn-secondary" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function addQuoteRow(quote='') {
      const container = document.getElementById('quote-list');
      const div = document.createElement('div');
      div.className = 'dynamic-item';
      div.innerHTML = `
        <input type="text" placeholder="Quote or highlight..." class="quote-text" value="${quote}">
        <button type="button" class="btn-secondary" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function addWordRow(word='', meaning='', page='') {
      const container = document.getElementById('word-list');
      const div = document.createElement('div');
      div.className = 'dynamic-item';
      div.innerHTML = `
        <input type="text" placeholder="Word" class="word-term" value="${word}" style="flex:1">
        <input type="text" placeholder="Meaning" class="word-meaning" value="${meaning}" style="flex:2">
        <input type="text" placeholder="Page #" class="word-page" value="${page}" style="flex:0.5">
        <button type="button" class="btn-secondary" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function addPracticeRow(text='', done=false) {
      const container = document.getElementById('practice-list-input');
      const div = document.createElement('div');
      div.className = 'dynamic-item';
      div.innerHTML = `
        <input type="text" placeholder="Actionable item..." class="practice-text" value="${text}">
        <input type="checkbox" class="practice-done" ${done ? 'checked' : ''}>
        <button type="button" class="btn-secondary" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(div);
    }

    function updatePreview(field) {
      const text = document.getElementById(`input-${field}`).value;
      document.getElementById(`preview-${field}`).innerHTML = marked.parse(text || '');
    }

    function calcDuration() {
      const start = new Date(document.getElementById('input-start-date').value);
      const finish = new Date(document.getElementById('input-finish-date').value);
      const display = document.getElementById('duration-display');
      
      if (!isNaN(start) && !isNaN(finish)) {
        const diffTime = Math.abs(finish - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        display.innerText = `Reading Duration: ${diffDays} day(s)`;
      } else {
        display.innerText = '';
      }
    }

    // CRUD ENTRIES & BOOKS
    function saveEntry(e) {
      e.preventDefault();
      
      const title = document.getElementById('input-title').value.trim();
      const author = document.getElementById('input-author').value.trim();
      
      // Find or create Book
      let book = appData.books.find(b => b.title.toLowerCase() === title.toLowerCase() && b.author.toLowerCase() === author.toLowerCase());
      if (!book) {
        book = { id: 'b_' + Date.now(), title, author };
        appData.books.push(book);
      }

      // Collect Dynamic Lists
      const characters = Array.from(document.querySelectorAll('#character-list .dynamic-item')).map(row => ({
        name: row.querySelector('.char-name').value,
        desc: row.querySelector('.char-desc').value
      })).filter(c => c.name);

      const quotes = Array.from(document.querySelectorAll('#quote-list .quote-text')).map(input => input.value).filter(Boolean);

      const newWords = Array.from(document.querySelectorAll('#word-list .dynamic-item')).map(row => ({
        word: row.querySelector('.word-term').value,
        meaning: row.querySelector('.word-meaning').value,
        page: row.querySelector('.word-page').value
      })).filter(w => w.word);

      const practices = Array.from(document.querySelectorAll('#practice-list-input .dynamic-item')).map(row => ({
        text: row.querySelector('.practice-text').value,
        done: row.querySelector('.practice-done').checked
      })).filter(p => p.text);

      const entryId = document.getElementById('entry-id').value || 'e_' + Date.now();
      
      const entryData = {
        id: entryId,
        bookId: book.id,
        status: document.getElementById('input-status').value,
        genre: document.getElementById('input-genre').value,
        startDate: document.getElementById('input-start-date').value,
        finishDate: document.getElementById('input-finish-date').value,
        tags: document.getElementById('input-tags').value.split(',').map(t => t.trim()).filter(Boolean),
        summary: document.getElementById('input-summary').value,
        theme: document.getElementById('input-theme').value,
        takeaways: document.getElementById('input-takeaways').value,
        characters,
        quotes,
        newWords,
        practices,
        rating: document.getElementById('input-rating').value,
        verdict: document.getElementById('input-verdict').value,
        isReread: document.getElementById('input-reread').checked,
        recommend: document.getElementById('input-recommend').checked,
        updatedAt: new Date().toISOString()
      };

      const existingIdx = appData.entries.findIndex(e => e.id === entryId);
      if (existingIdx > -1) {
        appData.entries[existingIdx] = entryData;
      } else {
        appData.entries.push(entryData);
      }

      saveData();
      alert('Entry saved successfully!');
      switchView('library');
    }

    function resetForm() {
      document.getElementById('entry-form').reset();
      document.getElementById('entry-id').value = '';
      document.getElementById('book-id').value = '';
      document.getElementById('character-list').innerHTML = '';
      document.getElementById('quote-list').innerHTML = '';
      document.getElementById('word-list').innerHTML = '';
      document.getElementById('practice-list-input').innerHTML = '';
      document.querySelectorAll('.md-preview').forEach(e => e.innerHTML = '');
      document.getElementById('duration-display').innerText = '';
    }

    // DASHBOARD & ANALYTICS
    function renderDashboard() {
      // Total Books
      document.getElementById('stat-total-books').innerText = appData.books.length;

      // Completed This Year
      const currentYear = new Date().getFullYear();
      const completedThisYear = appData.entries.filter(e => e.status === 'completed' && e.finishDate && new Date(e.finishDate).getFullYear() === currentYear);
      document.getElementById('stat-completed-year').innerText = completedThisYear.length;

      // Currently Reading List
      const readingEntries = appData.entries.filter(e => e.status === 'reading');
      const readingContainer = document.getElementById('currently-reading-list');
      readingContainer.innerHTML = readingEntries.length ? '' : '<p style="color:var(--text-muted)">Not reading anything right now.</p>';
      
      readingEntries.forEach(entry => {
        const book = appData.books.find(b => b.id === entry.bookId);
        if(!book) return;
        readingContainer.innerHTML += `
          <div class="book-card">
            <div>
              <div class="book-title">${book.title}</div>
              <div class="book-author">by ${book.author}</div>
              <span class="badge badge-reading">Reading</span>
            </div>
          </div>
        `;
      });

      // SVG Genre Pie/Bar Chart
      renderGenreChart();

      // GitHub Style Heatmap
      renderHeatmap();
    }

    function renderGenreChart() {
      const genres = {};
      appData.entries.forEach(e => {
        genres[e.genre] = (genres[e.genre] || 0) + 1;
      });

      const container = document.getElementById('genre-chart-container');
      if (Object.keys(genres).length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted)">No data available</p>';
        return;
      }

      const total = Object.values(genres).reduce((a,b) => a+b, 0);
      let svgHtml = `<svg viewBox="0 0 100 20" style="width:100%; border-radius:8px; overflow:hidden;">`;
      let currentX = 0;
      const colors = ['#8c4a27', '#d98a5b', '#e2ab8e', '#736b65', '#2c2523', '#4a6b5d'];

      Object.keys(genres).forEach((genre, idx) => {
        const width = (genres[genre] / total) * 100;
        svgHtml += `<rect x="${currentX}" y="0" width="${width}" height="20" fill="${colors[idx % colors.length]}"><title>${genre}: ${genres[genre]}</title></rect>`;
        currentX += width;
      });
      svgHtml += `</svg>`;

      // Legend
      let legendHtml = `<div style="display:flex; flex-wrap:wrap; gap:0.8rem; margin-top:0.5rem; font-size:0.8rem;">`;
      Object.keys(genres).forEach((genre, idx) => {
        legendHtml += `<div><span style="display:inline-block;width:10px;height:10px;background:${colors[idx % colors.length]};border-radius:2px;"></span> ${genre} (${genres[genre]})</div>`;
      });
      legendHtml += `</div>`;

      container.innerHTML = svgHtml + legendHtml;
    }

    function renderHeatmap() {
      const heatmap = document.getElementById('heatmap');
      heatmap.innerHTML = '';
      
      // Activity mapped by date strings YYYY-MM-DD
      const activity = {};
      appData.entries.forEach(e => {
        if(e.finishDate) activity[e.finishDate] = (activity[e.finishDate] || 0) + 1;
        if(e.startDate) activity[e.startDate] = (activity[e.startDate] || 0) + 1;
      });

      for (let i = 0; i < 53 * 7; i++) {
        const cell = document.createElement('div');
        cell.className = 'heatmap-cell';
        // Mock levels for visual demo
        if (i % 12 === 0) cell.setAttribute('data-level', '1');
        if (i % 25 === 0) cell.setAttribute('data-level', '2');
        if (i % 40 === 0) cell.setAttribute('data-level', '3');
        heatmap.appendChild(cell);
      }
    }

    // LIBRARY & SEARCH
    function renderLibrary() {
      const search = document.getElementById('filter-search').value.toLowerCase();
      const genre = document.getElementById('filter-genre').value;
      const status = document.getElementById('filter-status').value;

      const container = document.getElementById('library-book-list');
      container.innerHTML = '';

      appData.books.forEach(book => {
        const entries = appData.entries.filter(e => e.bookId === book.id);
        
        // Filter Checks
        const matchesSearch = book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search);
        const matchesGenre = !genre || entries.some(e => e.genre === genre);
        const matchesStatus = !status || entries.some(e => e.status === status);

        if (matchesSearch && matchesGenre && matchesStatus) {
          const latestEntry = entries[entries.length - 1] || {};
          container.innerHTML += `
            <div class="book-card">
              <div>
                <div class="book-title">${book.title}</div>
                <div class="book-author">by ${book.author}</div>
                <span class="badge badge-${latestEntry.status || 'want-to-read'}">${latestEntry.status || 'Want to Read'}</span>
                <div style="margin-top:0.5rem; font-size:0.85rem; color:var(--text-muted)">Entries: ${entries.length}</div>
              </div>
              <button class="btn-secondary" style="margin-top:1rem;" onclick="viewBookDetails('${book.id}')">View Entries & Compare</button>
            </div>
          `;
        }
      });
    }

    function viewBookDetails(bookId) {
      const book = appData.books.find(b => b.id === bookId);
      const entries = appData.entries.filter(e => e.bookId === bookId);
      const container = document.getElementById('book-detail-container');

      container.style.display = 'block';
      let html = `
        <h2>Entries for "${book.title}"</h2>
        <button class="btn-primary" style="margin-bottom:1rem;" onclick="addRereadEntry('${book.id}')">+ Add Reread Entry</button>
        <div class="entries-compare">
      `;

      entries.forEach((e, idx) => {
        html += `
          <div class="entry-box">
            <h4>Read #${idx + 1} (${e.status})</h4>
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.5rem;">${e.startDate || '?'} to ${e.finishDate || '?'}</div>
            <p><strong>Rating:</strong> ${'⭐'.repeat(e.rating || 0)}</p>
            <p><strong>Verdict:</strong> ${e.verdict || 'N/A'}</p>
            <div style="margin-top:0.8rem;">
              <strong>Takeaways:</strong>
              <div>${marked.parse(e.takeaways || '')}</div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      container.scrollIntoView({ behavior: 'smooth' });
    }

    function addRereadEntry(bookId) {
      const book = appData.books.find(b => b.id === bookId);
      switchView('editor');
      document.getElementById('input-title').value = book.title;
      document.getElementById('input-author').value = book.author;
      document.getElementById('input-reread').checked = true;
    }

    // GLOSSARY & QUIZ MODE
    function renderGlossary() {
      const container = document.getElementById('glossary-list');
      const search = document.getElementById('glossary-search').value.toLowerCase();
      container.innerHTML = '';

      appData.entries.forEach(entry => {
        const book = appData.books.find(b => b.id === entry.bookId);
        (entry.newWords || []).forEach(w => {
          if(w.word.toLowerCase().includes(search)) {
            container.innerHTML += `
              <div class="book-card">
                <div>
                  <div class="book-title">${w.word}</div>
                  <div style="font-size:0.9rem; margin: 0.4rem 0;">${w.meaning}</div>
                  <div class="book-author">Source: ${book ? book.title : 'Unknown'} (pg. ${w.page || 'N/A'})</div>
                </div>
              </div>
            `;
          }
        });
      });
    }

    let activeQuizWords = [];
    let currentQuizIndex = 0;

    function startQuizMode() {
      activeQuizWords = [];
      appData.entries.forEach(e => {
        if(e.newWords) activeQuizWords.push(...e.newWords);
      });

      if(activeQuizWords.length === 0) {
        alert("No vocabulary words saved yet!");
        return;
      }

      document.getElementById('quiz-container').style.display = 'block';
      currentQuizIndex = 0;
      showQuizCard();
    }

    function showQuizCard() {
      const wordObj = activeQuizWords[currentQuizIndex];
      document.getElementById('quiz-word-text').innerText = wordObj.word;
      document.getElementById('quiz-meaning-text').innerText = wordObj.meaning;
      document.getElementById('quiz-meaning-text').style.display = 'none';
      document.getElementById('btn-reveal').style.display = 'inline-block';
      document.getElementById('quiz-controls').style.display = 'none';
    }

    function revealQuizMeaning() {
      document.getElementById('quiz-meaning-text').style.display = 'block';
      document.getElementById('btn-reveal').style.display = 'none';
      document.getElementById('quiz-controls').style.display = 'flex';
    }

    function answerQuiz(known) {
      const wordObj = activeQuizWords[currentQuizIndex];
      // Interval-doubling simple spaced repetition tracking
      let state = appData.glossaryState[wordObj.word] || { interval: 1 };
      if(known) {
        state.interval *= 2;
      } else {
        state.interval = 1; // Resurface more often
      }
      appData.glossaryState[wordObj.word] = state;
      saveData();

      currentQuizIndex++;
      if(currentQuizIndex < activeQuizWords.length) {
        showQuizCard();
      } else {
        alert("Quiz finished!");
        document.getElementById('quiz-container').style.display = 'none';
      }
    }

    // PRACTICE LIST VIEW
    function renderPractice() {
      const container = document.getElementById('practice-items-container');
      container.innerHTML = '';

      appData.entries.forEach((entry, entryIdx) => {
        const book = appData.books.find(b => b.id === entry.bookId);
        (entry.practices || []).forEach((item, itemIdx) => {
          container.innerHTML += `
            <div class="entry-box" style="display:flex; align-items:center; gap:1rem;">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="togglePracticeDone(${entryIdx}, ${itemIdx})">
              <span style="${item.done ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${item.text}</span>
              <span style="margin-left:auto; font-size:0.8rem; color:var(--text-muted); font-style:italic;">from ${book ? book.title : 'Unknown'}</span>
            </div>
          `;
        });
      });
    }

    function togglePracticeDone(entryIdx, itemIdx) {
      appData.entries[entryIdx].practices[itemIdx].done = !appData.entries[entryIdx].practices[itemIdx].done;
      saveData();
      renderPractice();
    }

    // EXPORT / IMPORT (DATA PERSISTENCE BACKUP)
    function exportData() {
      const jsonStr = JSON.stringify(appData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `book-journal-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if(imported.books && imported.entries) {
            appData = imported;
            saveData();
            alert('Data restored successfully!');
            renderDashboard();
          } else {
            alert('Invalid JSON structure.');
          }
        } catch(err) {
          alert('Error parsing JSON file.');
        }
      };
      reader.readAsText(file);
    }

    // DARK/LIGHT MODE TOGGLE
    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }
  </script>
</body>
</html>
